# nginx 配置：提供前端构建产物 dist/，反代 /api 到本地后端。
server {
    listen 80;
    server_name _;

    # 前端构建产物（Vite build → dist/）。
    root /opt/local/agent-develop-task-doc/basic-service/app/web/dist;
    index index.html;

    # 上传体积（与后端 JTB_MAX_UPLOAD_MB 对齐，预留 multipart 开销）。
    client_max_body_size 101m;

    # 长生成的读写超时，兼容长 LLM 调用。
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;
    proxy_connect_timeout 10s;

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # API 反代到容器内 uvicorn（loopback）。
    location /api/ {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_buffering off;
        proxy_cache off;
    }

    # SSE 流式日志：禁用缓冲，确保实时推送。
    location ~ ^/api/stream/ {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:18130;
    }
    location = /redoc {
        proxy_pass http://127.0.0.1:18130;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:18130;
    }

    # SPA 静态资源（Vite 产出的 assets/）。
    location /assets/ {
        try_files $uri =404;
    }

    # SPA 回退。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
