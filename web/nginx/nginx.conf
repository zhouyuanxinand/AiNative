# nginx 配置：提供单文件 SPA，反代 /api 到本地后端。
server {
    listen 80;
    server_name _;

    # 前端单文件 SPA 与静态资源。
    root /opt/local/agent-develop-task-doc/basic-service/app/web;
    index index.html;

    # 上传体积（与后端 JTB_MAX_UPLOAD_MB 对齐，预留 multipart 开销）。
    client_max_body_size 101m;

    # 长生成的读写超时，兼容长 LLM 调用。
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;
    proxy_connect_timeout 10s;

    # 透传关联 ID 与标准转发头。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_buffering off;

    # API 反代到容器内 uvicorn（loopback）。
    location /api/ {
        proxy_pass http://127.0.0.1:18130;
    }
    location /docs {
        proxy_pass http://127.0.0.1:18130;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:18130;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:18130;
    }

    # SSE 流式日志：禁用缓冲。
    location ~ ^/api/stream/ {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA 静态资源。
    location /assets/ {
        try_files $uri =404;
    }

    # SPA 回退。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
