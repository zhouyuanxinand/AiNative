  - customer_documents
  - previous_design_information
  - composition_outline
  - contact_arrangement
  - interchangeability
  target_categories:
  - source_and_function
  - usage_environment
  - installation_form
  - product_composition
  - installation_dimension
  - installation_method
  - technical_support
  - reliability
  - maintainability
  - testability
  - supportability
  - safety
  - environmental_adaptability
  - process_requirement
  - appearance_requirement
