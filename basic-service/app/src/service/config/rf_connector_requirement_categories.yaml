version: '3.1'
template_id: rf_connector
exact_fragment_routing:
  enabled: true
  min_text_length: 24
  max_fragments_per_block: 12
  source_categories:
  - source_and_function
  - usage_environment
  - installation_form
  - product_composition
  - installation_method
  - installation_dimension
  - outline_dimension
  - interface_definition
  - termination_method
  - technical_support
  - reliability
  - maintainability
  - testability
  - supportability
  - safety
  - environmental_adaptability
  - process_requirement
  - schedule
  - appearance_requirement
  - other
  target_categories:
  - source_and_function
  - usage_environment
  - installation_form
  - product_composition
  - installation_method
  - installation_dimension
  - outline_dimension
  - interface_definition
  - termination_method
  - technical_support
  - reliability
  - maintainability
  - testability
  - supportability
  - safety
  - environmental_adaptability
  - process_requirement
  - material_selection
  - schedule
  - appearance_requirement
  - other
evidence_projections:
- source_category: performance_indicator
  target_category: environmental_adaptability
  match_any:
  - 工作温度
  - 使用温度
  - 环境温度
  - 温度范围
  extract_patterns:
  - '[-－−+]?\d+(?:\.\d+)?\s*(?:℃|°C)\s*[～~—至到]\s*[-－−+]?\d+(?:\.\d+)?\s*(?:℃|°C)'
- source_category: product_composition
  target_category: mating_interface
  match_any: [结构形式, 界面形式, 对接界面, 公头, 母头]
  extract_patterns:
  - '(?:界面形式|对接界面|插合界面)\s*[:：][^。；;\n]+|(?:直式|弯式)[^，,。；;\n]*(?:[，,]\s*(?:公头|母头)[^，,。；;\n]*)?|(?:公头|母头)[^，,。；;\n]*'
- source_category: product_composition
  target_category: installation_method
  match_any: [结构形式, 固定, 锁紧]
  extract_patterns:
  - '(?:螺纹锁紧|卡扣式固定|螺钉固定|卡扣固定|法兰固定)[^，,。；;\n]*'
- source_category: product_composition
  target_category: termination_method
  match_any: [端接, 对接, 压接, 焊接]
  extract_patterns:
  - '(?:端接(?:电缆)?形式|端接方式|电缆对接形式)\s*[:：][^。；;\n]+'
  - '(?:适配|采用)[^，,。；;\n]*(?:电缆|线缆)对接'
  - '(?:焊接|压接|焊杯|接线柱)[^，,。；;\n]*(?:电缆|线缆|导线)[^，,。；;\n]*'
- source_category: product_composition
  target_category: connected_coaxial_cable
  match_any: [适配线缆, 同轴电缆, 所接电缆]
  extract_patterns:
  - '(?:匹配|适配|采用)[^。；;\n]*(?:\d+\s*[ΩΩ]|RG\d)[^。；;\n]*'
- source_category: outline_dimension
  target_category: installation_dimension
  match_any: [安装孔位, 对接尺寸, 安装间距]
  extract_patterns:
  - '(?:具体适配安装孔位|安装孔位|安装间距|对接尺寸)[^。；;\n]*'
semantic_roles:
  standards_reference:
    label: 适用的法律法规要求
    definition: 文档引用、适用标准、法律法规和规范性文件
    source_heading_keywords:
    - 适用标准
    - 引用标准
    - 规范性引用文件
    source_content_patterns:
    - '^(?:\d+(?:\.\d+)*[.、]?\s*)?(?:适用标准|引用标准|规范性引用文件)\s*[:：]'
    content_priority: 120
    target_heading_keywords:
    - 适用的法律法规要求
    write_mode: standards_merge
    target_heading_level: 1
  intro_other:
    label: 产品功能用途中的其他
    definition: 产品功能用途章节中没有可提取内容时使用的受控空槽，不承载来源正文
    target_heading_keywords:
    - 其他
    target_heading_level: 2
    target_parent_heading: 产品的功能用途
categories:
  source_and_function:
    label: 来源和功能
    definition: 产品研制来源、背景、立项依据，以及产品用途、功能和任务能力
    source_heading_keywords:
    - 来源和功能
    - 产品功能
    - 产品用途
    - 概述
    target_heading_keywords:
    - 来源和功能
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 产品的功能用途
  usage_environment:
    label: 使用环境和部位
    definition: 产品应用背景、使用场景和应用领域中的完整用途背景，以及温度、气压、淋雨、电磁、海拔等工作环境与装配、搭载、部署、使用部位；应用背景与使用场景整章保持完整，不将其中功能定位或安装描述另行拆出
    source_heading_keywords:
    - 使用环境和部位
    - 安装使用环境
    - 使用环境
    - 使用部位
    - 应用背景与使用场景
    - 应用背景和使用场景
    source_parent_heading_keywords:
    - 应用背景与使用场景
    - 应用背景和使用场景
    atomic_source_heading_keywords:
    - 应用背景与使用场景
    - 应用背景和使用场景
    target_heading_keywords:
    - 使用环境和部位（可附图说明）
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 产品的功能用途
  installation_form:
    label: 安装形式和方法
    definition: 产品总体安装载体、固定端或自由端关系、板前或板后等总体安装形式；不等同于接口章节中的具体安装操作或尺寸
    source_heading_keywords:
    - 安装形式和方法
    - 安装形式
    - 安装方法
    source_content_patterns:
    - (?:安装|装配|固定|搭载|部署)在[^。；;\n]{0,60}(?:印制板|电路板|机架|舱内|设备|平台|载体)(?:上|内|处)?
    target_heading_keywords:
    - 安装形式和方法
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 产品的功能用途
  product_composition:
    label: 产品组成
    definition: 产品构成、部件、组件关系、结构形式及适配线缆；产品型号与结构形式章完整保留，明确的接口事实可按受控证据投影复用
    source_heading_keywords:
    - 产品组成
    - 组成结构
    - 产品型号与结构形式
    - 产品型号和结构形式
    - 结构形式
    - 适配线缆
    source_parent_heading_keywords:
    - 产品型号与结构形式
    - 产品型号和结构形式
    atomic_source_heading_keywords:
    - 产品型号与结构形式
    - 产品型号和结构形式
    - 结构形式
    - 适配线缆
    target_heading_keywords:
    - 产品组成
    target_integrity: exact
    target_heading_level: 1
  performance_indicator:
    label: 技术指标
    definition: 电气、机械、环境等定量或可检验性能要求；不包含已有独立槽位的互换性、安装方式和尺寸要求
    source_heading_keywords:
    - 重量
    - 工作电压
    - 额定电流
    - 工作电流
    - 冲击电流
    - 接触电阻
    - 介质耐电压
    - 绝缘电阻
    - 插拔力
    - 总分离力
    - 机械寿命
    - 振动
    - 冲击
    - 加速度
    - 工作温度
    - 高温
    - 低温
    - 低气压
    - 低温低气压
    target_heading_keywords:
    - 技术指标
    write_mode: indicator_table
    excluded_indicator_names:
    - 互换性
    - 互配性
    target_heading_level: 2
    target_parent_heading: 技术要求
  outline_dimension:
    label: 外形尺寸
    definition: 产品或核心部件的外观轮廓、长宽高、外形公差、外形图和结构边界尺寸；无法明确区分的尺寸按受控规则可进入本类
    source_heading_keywords:
    - 外形尺寸
    - 外形要求
    - 外形图
    - 整体尺寸
    source_content_patterns:
    - '^(?:\d+(?:\.\d+)*[.、]?\s*)?(?:整体尺寸|外形尺寸)\s*[:：]'
    target_heading_keywords:
    - 外形尺寸
    target_heading_level: 3
    target_parent_heading: 接口尺寸要求
    target_integrity: exact
  installation_dimension:
    label: 安装尺寸
    definition: 安装空间、安装限位、占位、孔位、导向间隙、导向长度和安装适配的几何尺寸约束
    source_heading_keywords:
    - 安装尺寸
    - 安装空间
    - 安装限位尺寸
    - 安装占位尺寸
    target_heading_keywords:
    - 安装尺寸
    target_heading_level: 3
    target_parent_heading: 接口尺寸要求
    target_integrity: exact
  installation_method:
    label: 安装方式
    definition: 螺钉、导销、卡扣、导轨、焊接、嵌入等具体安装固定方式、操作步骤和流程
    source_heading_keywords:
    - 安装方式
    - 固定方式
    - 安装要求
    source_content_patterns:
    - '^(?:\d+(?:\.\d+)*[.、]?\s*)?(?:安装要求|安装方式|固定方式)\s*[:：]'
    target_heading_keywords:
    - 安装方式
    target_heading_level: 3
    target_parent_heading: 接口尺寸要求
    replicate_to_categories:
    - installation_form
    target_integrity: exact
  termination_method:
    label: 端接形式
    definition: 端接、接线、压接、焊接等电气或机械连接形式
    source_heading_keywords:
    - 端接形式
    - 端接方式
    - 接线方式
    - 压接方式
    - 焊接方式
    target_heading_keywords:
    - 端接电缆形式
    target_heading_level: 3
    target_parent_heading: 接口尺寸要求
    target_integrity: exact
  interface_definition:
    label: 接口尺寸
    definition: 接口、节点排列、定位关系、针脚或接点定义，以及对接定位、插合方向和接口几何约束；本类作为尺寸子槽容器时不得直接承载正文
    source_heading_keywords:
    - 接口尺寸要求
    - 接口尺寸
    - 接口要求
    - 导向要求
    - 解锁按钮位置及尺寸
    container_only: true
    block_target_categories:
    - outline_dimension
    - installation_dimension
    - installation_method
    - termination_method
    - mating_interface
    - connected_coaxial_cable
    block_fallback_category: outline_dimension
  technical_support:
    label: 保障要求
    definition: 条件保障、验收和交付要求，包括随产品提供的说明书、合格证、工具、备件、维修手册和技术资料等事实
    source_heading_keywords:
    - 条件保障要求
    - 技术保障要求
    - 保障要求
    - 验收要求
    - 检验验收
    - 交付要求
    source_parent_heading_keywords:
    - 验收及交付要求
    source_content_patterns:
    - (?:随产品|随机|交付时)[^。；;\n]*(?:提供|配备)[^。；;\n]*(?:使用说明书|技术说明书|维修手册|合格证|工具|备件|技术资料)
    - (?:提供|配备)[^。；;\n]*(?:使用说明书|技术说明书|维修手册|随机工具|随机备件|接触件备件|合格证)
    content_priority: 100
    target_heading_keywords:
    - 条件保障要求
    target_heading_level: 2
    write_mode: dynamic_children
    target_integrity: exact
    target_parent_heading: 技术要求
  reliability:
    label: 可靠性要求
    definition: 平均无故障时间、寿命、耐久度、故障率、稳定性、容错和可靠性试验要求
    source_heading_keywords:
    - 可靠性要求
    - 可靠性
    target_heading_keywords:
    - 可靠性要求
    target_integrity: exact
    target_heading_level: 2
    target_parent_heading: 通用质量特性要求
  maintainability:
    label: 维修性要求
    definition: 平均修复时间、可达性、可拆卸性、故障隔离、维修操作、维修工具和维修保障要求
    source_heading_keywords:
    - 维修性要求
    - 维修保障要求
    - 维修性
    target_heading_keywords:
    - 维修性要求
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 通用质量特性要求
  testability:
    label: 测试性要求
    definition: 机内测试、故障检测与隔离、虚警率、测试覆盖、测试设备、流程、精度和验收要求
    source_heading_keywords:
    - 测试性要求
    - 测试性
    target_heading_keywords:
    - 测试性要求
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 通用质量特性要求
  supportability:
    label: 保障性要求
    definition: 六性中的综合保障设计、保障资源配置、保障分析、保障方案、保障成本和持续保障要求；不是随产品交付清单
    source_heading_keywords:
    - 保障性要求
    - 保障性
    target_heading_keywords:
    - 保障性要求
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 通用质量特性要求
  safety:
    label: 安全性定性要求
    definition: 使用、安装、运维、存储和运输过程中的电气、机械、防火防爆、防误操作和人员设备安全要求
    source_heading_keywords:
    - 安全性定性要求
    - 安全性要求
    - 安全性
    target_heading_keywords:
    - 安全性定性要求
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 通用质量特性要求
  environmental_adaptability:
    label: 环境适应性要求
    definition: 高低温、湿热、盐雾、霉菌、淋雨、沙尘、振动冲击、低气压、老化等专项环境适应性与试验要求
    source_heading_keywords:
    - 环境适应性要求
    - 环境适应性
    target_heading_keywords:
    - 环境适应性要求
    target_heading_level: 2
    target_integrity: exact
    target_parent_heading: 通用质量特性要求
  process_requirement:
    label: 工艺要求
    definition: 研制、生产、装配和调试过程中的加工、焊接、粘接、紧固、表面处理、密封、公差和工艺验收要求；结构材质、内外导体、绝缘介质、外壳和密封件的材料选用归材料选用要求，不因其中含镀层或密封字样转入工艺
    source_heading_keywords:
    - 工艺要求
    - 制造工艺
    - 装配工艺
    target_heading_keywords:
    - 工艺要求
    target_heading_level: 1
    empty_policy: fill_none
    target_integrity: exact
  material_selection:
    label: 设计开发所需其他要求（材料选用）
    definition: 结构材质及元器件原材料选用，包括内外导体、绝缘介质、外壳壳体、密封件材质和选材附带的镀层要求；完整复制到设计开发所需其他要求，不与加工装配工艺混淆
    source_heading_keywords:
    - 结构材质要求
    - 结构材料要求
    - 材料选用要求
    - 元器件和原材料选用要求
    - 元器件和材料选用要求
    - 原材料和元器件选用要求
    source_parent_heading_keywords:
    - 结构材质要求
    - 结构材料要求
    atomic_source_heading_keywords:
    - 结构材质要求
    - 结构材料要求
    - 材料选用要求
    - 元器件和原材料选用要求
    - 元器件和材料选用要求
    - 原材料和元器件选用要求
    source_content_patterns:
    - '^(?:[（(]?\d+[)）.、]?\s*)?(?:内外导体|绝缘介质|外壳壳体|密封件)\s*[:：].*(?:材质|采用|镀|密封圈)'
    content_priority: 110
    target_heading_keywords:
    - 设计开发所需其他要求
    target_heading_level: 1
    target_integrity: exact
  schedule:
    write_mode: preserve_template
    label: 进度要求
    definition: 研制进度、周期、阶段时间、任务节点和交付计划要求
    source_heading_keywords:
    - 任务进度要求
    - 研制进度
    - 进度要求
    target_heading_keywords:
    - 任务进度要求
    target_heading_level: 1
    target_integrity: exact
  appearance_requirement:
    label: 外观要求
    definition: 产品外观、外形和可见状态要求；按 7-22 直接复制到“产品的功能用途”下的“其他”槽
    source_heading_keywords:
    - 外观要求
    source_content_patterns:
    - '^(?:\d+(?:\.\d+)*[.、]?\s*)?外观要求\s*[:：]'
    target_heading_keywords:
    - 其他
    target_heading_level: 2
    target_parent_heading: 产品的功能用途
    target_integrity: exact
  other:
    label: 其他要求
    definition: 无法归入以上类别、来源明确标为“其他要求”，或按 7-22 指定进入顾客特殊要求的完整设计输入模块
    source_heading_keywords:
    - 其他要求
    - 安装使用注意事项
    - 研制批产品数量要求
    - 研制批产品数量
    - 研制批数量要求
    atomic_source_heading_keywords:
    - 安装使用注意事项
    - 研制批产品数量要求
    - 研制批产品数量
    - 研制批数量要求
    target_heading_keywords:
    - 其他要求
    target_parent_heading: 顾客的特殊要求
    preserve_child_headings: true
    insert_position: after_children
    target_integrity: exact
    target_heading_level: 2
  mating_interface:
    label: 界面形式
    definition: 射频连接器的对接界面形式与连接界面定义
    source_heading_keywords:
    - 界面形式
    target_heading_keywords:
    - 界面形式
    target_heading_level: 3
    target_parent_heading: 接口尺寸要求
    target_integrity: exact
  connected_coaxial_cable:
    label: 所接同轴电缆型号
    definition: 本次射频产品连接的同轴电缆型号与规格
    source_heading_keywords:
    - 所接同轴电缆型号
    target_heading_keywords:
    - 所接同轴电缆型号
    target_heading_level: 3
    target_parent_heading: 接口尺寸要求
    target_integrity: exact
