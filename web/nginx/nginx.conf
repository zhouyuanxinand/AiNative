# nginx 配置：提供前端构建产物 dist/，反代 /api 到本地后端。
# 登录回跳会在查询参数中携带一次性凭证。访问日志只记路径，不记录查询或 Referer。
log_format taskbook_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';
# 只信任直接连接 nginx 的已配置网关 IP；不读取客户端声称的转发来源。
# 可选文件每行填写“实际网关 IP 1;”，无文件时也可启动；不接受 CIDR。
map $remote_addr $taskbook_trusted_proxy {
    default 0;
    127.0.0.1 1;
    ::1 1;
    include /etc/nginx/taskbook-trusted-proxies.d/*.conf;
}
# 可信 HTTPS 网关必须覆盖客户端协议头；直连与其他值沿用实际协议。
# 外部主机始终来自保留端口的 Host。
map "$taskbook_trusted_proxy:$http_x_forwarded_proto" $taskbook_external_scheme {
    default $scheme;
    "1:https" https;
}
server {
    listen 80;
    server_name _;

    # 前端构建产物（Vite build → dist/）。
    root /opt/local/agent-develop-task-doc/basic-service/app/web/dist;
    index index.html;

    # 上传体积（与后端 JTB_MAX_UPLOAD_MB 对齐，预留 multipart 开销）。
    client_max_body_size 101m;

    # 长生成的读写超时，兼容长 LLM 调用。
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;
    proxy_connect_timeout 10s;

    access_log /dev/stdout taskbook_safe;
    error_log /dev/stderr warn;

    # API 反代到容器内 uvicorn（loopback）。
    location /api/ {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_buffering off;
        proxy_cache off;
    }

    # SSE 流式日志：禁用缓冲，确保实时推送。
    location ~ ^/api/stream/ {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
    }
    location = /redoc {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
    }

    # SPA 静态资源（Vite 产出的 assets/）。
    location /assets/ {
        try_files $uri =404;
    }

    # 页面入口也必须经过后端，否则 SSO 回跳参数无法得到校验和清理。
    # 构建后的资源仍由上面的 /assets/ 直接提供。
    location / {
        proxy_pass http://127.0.0.1:18130;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# 独立反馈管理入口；主站的 /api/ 仍只转发主后端，不开放管理接口。
server {
    listen 81;
    server_name _;

    access_log /dev/stdout taskbook_safe;
    error_log /dev/stderr warn;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:18131;
        proxy_http_version 1.1;
        # 保留发布端口，供后端进行同源校验。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $taskbook_external_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }
}
