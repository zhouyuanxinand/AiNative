        label: 适航
      civil_aviation:
        <<: *low_frequency_domain
        label: 民机
      as9100:
        <<: *low_frequency_domain
        label: AS9100

  rf_contact:
    label: 射频连接器-射频接触件
    enabled: false
    template_label: 研制任务书（射频）
    unavailable_reason: 尚未配置并验收射频连接器真实模板
    domains: {}
  rf_hybrid:
    label: 射频连接器-高低频混装连接器
