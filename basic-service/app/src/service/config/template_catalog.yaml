version: "2.1"

# 产品类型与模板的对应关系来自本地受控《研制任务书生成规则7-22.xlsx》。
# 只有已经取得真实模板的类型才允许生成；没有模板的选项仍在网页显示，
# 但保持 disabled，禁止拿低频模板冒充别的模板。
aliases:
  connector/general: low_frequency_rectangular/military
  connector/low_frequency: low_frequency_rectangular/military
  low_frequency_connector/military: low_frequency_rectangular/military
  low_frequency_connector/airworthiness: low_frequency_rectangular/airworthiness
  low_frequency_connector/civil_aviation: low_frequency_rectangular/civil_aviation
  low_frequency_connector/as9100: low_frequency_rectangular/as9100
  rf_connector/military: rf_contact/military
  filter_connector_legacy/military: filter_connector/military
  cable_assembly_legacy/military: cable_assembly/military
  fluid_connector/military: liquid_cooling_connector/military
  indoor_fiber_connector/military: high_speed_io/military
  outdoor_fiber_connector/military: high_speed_backplane/military
  civil_aircraft_product/civil_aviation: high_speed_io/civil_aviation

product_types:
  low_frequency_rectangular:
    label: 低频连接器-矩形低频
    enabled: true
    template_label: 研制任务书（低频）
    domains:
      military: &low_frequency_domain
        label: 军品
        template: connector_taskbook.docx
        profile: connector_profile.yaml
        category_mapping: connector_requirement_categories.yaml
        preserve_unfilled_template: true
      airworthiness:
        <<: *low_frequency_domain
        label: 适航
      civil_aviation:
        <<: *low_frequency_domain
        label: 民机
      as9100:
        <<: *low_frequency_domain
        label: AS9100

  low_frequency_circular:
    label: 低频连接器-圆形低频
    enabled: false
    template_label: 研制任务书（低频）
    unavailable_reason: 尚未配置并验收圆形低频独立 Profile 与真实回归样例
    domains:
      military: *low_frequency_domain
      airworthiness:
        <<: *low_frequency_domain
        label: 适航
      civil_aviation:
        <<: *low_frequency_domain
        label: 民机
      as9100:
        <<: *low_frequency_domain
        label: AS9100

  low_frequency_twist_pin:
    label: 低频连接器-绞针低频
    enabled: false
    template_label: 研制任务书（低频）
    unavailable_reason: 尚未配置并验收绞针低频独立 Profile 与真实回归样例
    domains:
      military: *low_frequency_domain
      airworthiness:
